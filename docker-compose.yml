# Hạ tầng cho dev/staging. Trên máy dev hiện tại Postgres chạy bằng Homebrew,
# nên có thể chỉ cần: docker compose up -d minio minio-init
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ksvh_qc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9001 = giao diện quản lý MinIO
    volumes: [miniodata:/data]

  # Tạo sẵn bucket ksvh-qc một lần
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/ksvh-qc"

volumes:
  pgdata:
  miniodata:
