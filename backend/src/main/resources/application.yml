spring:
  application:
    name: ksvh-qc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ksvh_qc}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # bảng do Flyway tạo, Hibernate chỉ kiểm tra
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB      # file Excel nhập danh mục (ảnh không đi qua Spring, xem quy tắc 3)
      max-request-size: 6MB

server:
  port: ${PORT:8088}
  forward-headers-strategy: framework   # đứng sau Nginx: lấy IP/proto thật từ X-Forwarded-*

app:
  jwt:
    secret: ${JWT_SECRET:}          # bắt buộc ở môi trường thật, tối thiểu 32 ký tự
    issuer: ksvh-qc
    access-ttl: 15m
  auth:
    refresh-ttl: 14d
    refresh-absolute-ttl: 30d
    reuse-grace: 20s
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}   # vd: https://qc.ksvh.vn (phân tách bằng dấu phẩy)
    cookie:
      name: ksvh_rt
      path: /api/v1/auth
      secure: true
      same-site: Strict
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:ksvh-qc}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    presign-ttl: 10m
    max-upload-bytes: 10485760     # 10MB
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:${AUTH_ALLOWED_ORIGINS:}}
      max-age: 1h

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
