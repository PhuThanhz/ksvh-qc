# Chỉ dùng cho máy dev. KHÔNG dùng các giá trị này ở môi trường thật.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  auth:
    cookie:
      secure: false   # dev chạy http://localhost; môi trường thật luôn true
  storage:
    # Ảnh upload qua proxy HTTPS của Vite (xem frontend/vite.config.ts).
    # Test trên điện thoại: đặt S3_PUBLIC_ENDPOINT=https://<IP-máy-tính>:5273
    public-endpoint: ${S3_PUBLIC_ENDPOINT:https://localhost:5273}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
  web:
    cors:
      allowed-origins:
        - http://localhost:5273
        - https://localhost:5273
  seed:
    users:
      - { username: admin, password: Admin@123, full-name: Quản trị viên, roles: [ADMIN] }
      - { username: manager, password: Manager@123, full-name: Quản lý Demo, roles: [MANAGER] }
      - { username: auditor, password: Auditor@123, full-name: Người chấm Demo, roles: [AUDITOR] }

logging:
  level:
    vn.ksvh.qc: DEBUG
