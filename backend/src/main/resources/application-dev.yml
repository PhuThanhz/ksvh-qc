# Chỉ dùng cho máy dev. KHÔNG dùng các giá trị này ở môi trường thật.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  auth:
    cookie:
      secure: false   # dev chạy http://localhost; môi trường thật luôn true
  storage:
    # Ảnh upload qua proxy HTTPS của Vite (xem frontend/vite.config.ts).
    # Test trên điện thoại: đặt S3_PUBLIC_ENDPOINT=https://<IP-máy-tính>:5273
    public-endpoint: ${S3_PUBLIC_ENDPOINT:https://localhost:5273}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
  web:
    cors:
      allowed-origins:
        - http://localhost:5273
        - https://localhost:5273
  seed:
    # Nạp dữ liệu mẫu (công ty, nhà hàng, nhân viên, nhóm/tiêu chí ví dụ) khi DB còn trống. Test tắt mục này.
    sample-data: true
    users:
      # Mỗi vai trò một tài khoản thử (docs/DOMAIN_SPEC.md §2). Chỉ tạo nếu username chưa tồn tại.
      - { username: admin, password: Admin@123, full-name: Quản trị hệ thống Demo, roles: [SYSTEM_ADMIN, KSVH_LEAD, KSVH_MANAGER, BUSINESS_ADMIN, EXECUTIVE] }
      - { username: bizadmin, password: Bizadmin@123, full-name: Quản trị nghiệp vụ Demo, roles: [BUSINESS_ADMIN] }
      - { username: lead, password: Lead@123, full-name: Trưởng nhóm KSVH Demo, roles: [KSVH_LEAD] }
      - { username: manager, password: Manager@123, full-name: Quản lý KSVH Demo, roles: [KSVH_MANAGER] }
      - { username: inspector, password: Inspector@123, full-name: Chuyên viên KSVH Demo, roles: [KSVH_INSPECTOR] }
      - { username: store, password: Store@123, full-name: Cửa hàng trưởng Demo, roles: [STORE_MANAGER] }
      - { username: obm, password: Obm@123, full-name: OBM Demo, roles: [OBM] }
      - { username: executive, password: Executive@123, full-name: Ban Giám đốc Demo, roles: [EXECUTIVE] }

logging:
  level:
    vn.ksvh.qc: DEBUG
